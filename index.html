<title>Fisica 2 — Quiz Appelli</title>
<style>
    #loginScreen{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#f6f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.loginBox{
  width:100%;
  max-width:400px;
  background:white;
  border:1px solid #dde3ea;
  border-radius:18px;
  padding:30px;
  box-shadow:0 8px 26px rgba(25,35,50,.10);
  text-align:center;
}

.loginBox h2{
  margin-top:0;
}

.loginBox input{
  width:100%;
  padding:13px;
  margin:15px 0 10px;
  border:1px solid #dde3ea;
  border-radius:11px;
  font-size:16px;
}

.loginBox button{
  width:100%;
  border:0;
  border-radius:12px;
  padding:12px;
  background:#2563eb;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

#loginError{
  color:#b91c1c;
  margin-top:12px;
  display:none;
}
:root{--bg:#f6f7fb;--card:#fff;--text:#17212b;--muted:#687483;--line:#dde3ea;--accent:#2563eb;--ok:#15803d;--bad:#b91c1c;--soft:#eef4ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:940px;margin:0 auto;padding:20px}.hero{padding:18px 0 8px}.hero h1{font-size:clamp(28px,5vw,46px);margin:0 0 7px}.hero p{color:var(--muted);margin:0;line-height:1.5}
.panel,.qcard,.result{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 26px rgba(25,35,50,.06)}.panel{padding:18px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px;color:#415064}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:white;font:inherit}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;font:inherit}.primary{background:var(--accent);color:white}.secondary{background:#edf1f5;color:#243244}.danger{background:#fff0f0;color:var(--bad)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}
.progressrow{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:14px;margin:14px 2px 8px}.bar{height:9px;border-radius:99px;background:#e6ebf1;overflow:hidden}.bar>div{height:100%;background:var(--accent);width:0;transition:.25s}
.qcard{padding:clamp(18px,4vw,32px);margin-top:18px}.badge{display:inline-flex;background:var(--soft);color:#234c9d;padding:6px 9px;border-radius:99px;font-size:12px;font-weight:800;margin-right:6px}.qtitle{font-size:clamp(19px,3vw,26px);line-height:1.42;margin:18px 0 20px}.options{display:grid;gap:10px}.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:13px;cursor:pointer;line-height:1.4}.opt:hover{background:#fafcff}.opt input{margin-top:4px;transform:scale(1.15)}.numinput{font-size:21px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;max-width:360px;width:100%}.unit{font-weight:800;margin-left:7px;color:#4b5968}.feedback{margin-top:16px;padding:14px;border-radius:12px;line-height:1.45}.feedback.ok{background:#edf9f0;color:#14532d}.feedback.bad{background:#fff1f1;color:#7f1d1d}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.result{padding:24px;margin-top:20px}.score{font-size:48px;font-weight:900}.small{color:var(--muted);font-size:14px}.review{display:grid;gap:10px;margin-top:18px}.reviewitem{border:1px solid var(--line);border-radius:12px;padding:12px}.reviewitem strong{display:block;margin-bottom:4px}.good{border-left:5px solid var(--ok)}.wrong{border-left:5px solid var(--bad)}
@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:14px}.panel{padding:14px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.nav .btn{flex:1}}
</style>
</head>
<body>
    <div id="loginScreen">
  <div class="loginBox">
    <h2>Fisica 2 — Quiz</h2>
    <p>Inserisci la password per accedere.</p>

    <input
      type="password"
      id="passwordInput"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">Accedi</button>

    <div id="loginError">Password errata.</div>
  </div>
</div>
<div class="wrap">
<header class="hero"><h1>Fisica 2 — Quiz Appelli</h1><p>Domande ricavate dai tuoi appelli e dalle foto. Crocette + esercizi numerici, con correzione e ripasso degli errori.</p></header>
<section id="setup" class="panel">
<div class="grid">
<div class="field"><label>Modalità</label><select id="mode"><option value="train">Allenamento (correzione subito)</option><option value="exam">Simulazione (correzione alla fine)</option></select></div>
<div class="field"><label>Argomento</label><select id="category"><option value="all">Tutti</option></select></div>
<div class="field"><label>Numero domande</label><select id="count"><option>10</option><option>20</option><option selected>30</option><option value="all">Tutte</option></select></div>
<div class="field"><label>Ordine</label><select id="order"><option value="random">Casuale</option><option value="source">Banca dati</option></select></div>
</div>
<div class="toolbar"><button class="btn primary" id="start">Inizia quiz</button><button class="btn secondary" id="wrongOnly">Ripassa gli errori salvati</button><button class="btn danger" id="clearWrong">Azzera errori salvati</button></div>
<p class="small" id="bankInfo"></p>
</section>
<section id="quiz" class="hidden">
<div class="progressrow"><span id="progressText"></span><span id="liveScore"></span></div><div class="bar"><div id="barFill"></div></div>
<div class="qcard"><div><span class="badge" id="catBadge"></span><span class="badge" id="sourceBadge"></span></div><div class="qtitle" id="questionText"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div class="nav"><button class="btn secondary" id="prev">← Indietro</button><button class="btn primary" id="check">Conferma</button><button class="btn primary hidden" id="next">Avanti →</button></div></div>
</section>
<section id="results" class="result hidden"><div class="small">Risultato</div><div class="score" id="score"></div><p id="summary"></p><div class="toolbar"><button class="btn primary" id="retryWrong">Rifai solo gli errori</button><button class="btn secondary" id="restart">Nuovo quiz</button></div><div class="review" id="review"></div></section>
</div>
<script>
const BANK=[{"id": "T01", "type": "mcq", "cat": "Magnetostatica", "source": "Appello 07/07/2026", "q": "Due fili rettilinei indefiniti paralleli percorsi da correnti nello stesso verso:", "opts": ["si respingono", "non si scambiano forze perché non sono perpendicolari", "si scambiano forze solo se sono carichi elettricamente", "si attraggono"], "answer": 3, "exp": "Correnti parallele nello stesso verso si attraggono."}, {"id": "T02", "type": "mcq", "cat": "Elettrostatica", "source": "Appello 07/07/2026 / foto", "q": "Una carica effettua un percorso chiuso in una regione dove esistono campi elettrostatici ed elettromotori non dipendenti dal tempo. Il lavoro totale compiuto dalle forze del campo, in generale:", "opts": ["è il solo lavoro speso dal campo elettromotore", "è la somma di due lavori entrambi non nulli", "è sempre nullo", "è il solo lavoro speso dal campo elettrostatico"], "answer": 0, "exp": "Il campo elettrostatico è conservativo: su un percorso chiuso compie lavoro nullo. Resta il contributo elettromotore."}, {"id": "T03", "type": "mcq", "cat": "Magnetostatica", "source": "Appello 07/07/2026 / foto", "q": "Un circuito piano chiuso, filiforme e indeformabile, percorso da corrente stazionaria e immerso in un campo di induzione magnetica uniforme, in generale sperimenta:", "opts": ["una forza nulla e un momento torcente non nullo", "una forza non nulla e un momento torcente nullo", "nessuna azione meccanica", "una forza non nulla e un momento torcente non nullo"], "answer": 0, "exp": "In un campo B uniforme la forza risultante su una spira chiusa è nulla; in generale può esserci una coppia τ = m × B."}, {"id": "T04", "type": "mcq", "cat": "Onde EM e ottica", "source": "Appello 07/07/2026", "q": "Nello spettro elettromagnetico, luce visibile, microonde e raggi X hanno, nel vuoto:", "opts": ["uguali frequenze", "differenti lunghezze d'onda", "differenti velocità di propagazione", "nessuna delle altre risposte"], "answer": 1, "exp": "Nel vuoto tutte le onde EM viaggiano a c, ma hanno frequenze e lunghezze d'onda diverse."}, {"id": "T05", "type": "mcq", "cat": "Onde EM e ottica", "source": "Appello 07/07/2026 / foto", "q": "Per incidenza normale, nel passaggio dal mezzo 1 (indice n₁) al mezzo 2 (indice n₂), il coefficiente di riflessione per l'ampiezza del campo elettrico vale:", "opts": ["(n₁+n₂)/(n₁−n₂)", "2n₁/(n₁+n₂)", "2n₂/(n₁+n₂)", "(n₁−n₂)/(n₁+n₂)"], "answer": 3, "exp": "Per mezzi non magnetici, r_E = (n₁ − n₂)/(n₁ + n₂)."}, {"id": "T06", "type": "mcq", "cat": "Conduttori e dielettrici", "source": "Appello 07/07/2026 / foto", "q": "Una sfera piena metallica neutra è vicina a un conduttore neutro con una cavità contenente una carica puntiforme q>0. La sfera:", "opts": ["è attratta dal conduttore", "è respinta dal conduttore", "è attratta o respinta a seconda della distanza", "rimane imperturbata"], "answer": 0, "exp": "La carica nella cavità induce carica sulla superficie esterna del conduttore, che polarizza la sfera neutra e produce attrazione."}, {"id": "T07", "type": "mcq", "cat": "Elettrostatica", "source": "Appello 07/07/2026 / foto", "q": "Dato il campo elettrostatico E nel vuoto, la densità di energia elettrostatica vale:", "opts": ["½ E²/ε₀", "½ ε₀²E", "½ ε₀E²", "½ ε₀E"], "answer": 2, "exp": "Nel vuoto u_E = ½ ε₀ E²."}, {"id": "T08", "type": "mcq", "cat": "Onde EM e ottica", "source": "Appello 07/07/2026", "q": "Per un'onda piana armonica di frequenza ν che si propaga nel vuoto, è falso che:", "opts": ["E e B sono perpendicolari tra loro", "k = 2πν/c", "λ = c/ν", "B è parallelo alla direzione di propagazione"], "answer": 3, "exp": "Un'onda EM piana è trasversale: E e B sono entrambi perpendicolari alla direzione di propagazione."}, {"id": "T09", "type": "mcq", "cat": "Elettrostatica", "source": "Appello 07/07/2026", "q": "Le regioni equipotenziali esterne a una sfera conduttrice isolata e carica negativamente sono:", "opts": ["piani tangenti con potenziale decrescente con la distanza", "sfere concentriche con potenziale decrescente con il raggio", "sfere concentriche con potenziale crescente con il raggio", "piani passanti per il centro"], "answer": 2, "exp": "V=kQ/r è negativo e tende a 0 aumentando r: quindi il valore di V cresce all'aumentare di r."}, {"id": "T10", "type": "mcq", "cat": "Circuiti", "source": "Appello 07/07/2026", "q": "In regime stazionario, la I legge di Kirchhoff (legge dei nodi) afferma che:", "opts": ["la somma dei moduli delle correnti uscenti è zero", "la somma algebrica delle correnti entranti è la stessa in ogni nodo", "la somma delle correnti in una maglia è uguale alla fem", "la somma algebrica delle correnti entranti in un nodo è zero"], "answer": 3, "exp": "È la conservazione della carica: somma algebrica delle correnti al nodo = 0."}, {"id": "T11", "type": "mcq", "cat": "Analisi vettoriale", "source": "Appello 07/07/2026 / foto", "q": "Il teorema di Stokes per una superficie aperta S di contorno Γ stabilisce che ∮Γ K·dl è uguale a:", "opts": ["∫S K×dS", "∫S (∇×K)·dS", "∫S (∇·K)dS", "∫S ∇·dS"], "answer": 1, "exp": "Teorema di Stokes: ∮ K·dl = ∫ (∇×K)·dS."}, {"id": "T12", "type": "mcq", "cat": "Magnetostatica", "source": "Appello 07/07/2026", "q": "Il campo di induzione magnetica al centro di una spira circolare percorsa da corrente nel vuoto è:", "opts": ["nullo per simmetria", "tangente alla spira", "radiale nel verso della corrente", "perpendicolare al piano della spira"], "answer": 3, "exp": "Per simmetria B è diretto lungo l'asse della spira."}, {"id": "T13", "type": "mcq", "cat": "Magnetismo nei materiali", "source": "Appello 07/07/2026 / foto", "q": "In un materiale magnetico L.I.O., il vettore magnetizzazione M:", "opts": ["è dato dal valore medio dei momenti di dipolo magnetico per unità di volume", "è positivo o negativo a seconda che il materiale sia para- o diamagnetico", "è uguale al momento torcente della forza di Lorentz", "è pari al momento magnetico totale del materiale"], "answer": 0, "exp": "La magnetizzazione è il momento magnetico dipolare per unità di volume."}, {"id": "T14", "type": "mcq", "cat": "Elettrostatica", "source": "Appello 07/07/2026", "q": "Un dipolo elettrico posto in un campo elettrico uniforme e costante, in generale:", "opts": ["non subisce alcuna influenza", "ruota per disporsi perpendicolarmente al campo", "ruota per allinearsi alla direzione e verso del campo", "trasla lungo la direzione del campo"], "answer": 2, "exp": "La coppia τ=p×E tende ad allineare p con E; in campo uniforme la forza netta è nulla."}, {"id": "T15", "type": "mcq", "cat": "Magnetostatica", "source": "Appello 07/07/2026", "q": "Il lavoro compiuto dalla forza magnetica agente su una carica in moto in un campo di induzione magnetica:", "opts": ["è sempre nullo", "è proporzionale alla velocità", "dipende dall'angolo tra velocità e campo", "è inversamente proporzionale al campo"], "answer": 0, "exp": "La forza magnetica è sempre perpendicolare alla velocità istantanea, quindi non compie lavoro."}, {"id": "T16", "type": "mcq", "cat": "Analisi vettoriale", "source": "Foto appelli", "q": "Attraverso una superficie chiusa S un campo solenoidale, anche se variabile nel tempo, ha flusso:", "opts": ["dipendente dal campo e dalla superficie", "sempre non nullo", "sempre nullo", "dipendente dalla legge temporale"], "answer": 2, "exp": "Campo solenoidale significa ∇·F=0; per Gauss il flusso attraverso una superficie chiusa è nullo."}, {"id": "T17", "type": "mcq", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un'onda piana si propaga lungo +ŷ e, in un certo istante, E è orientato come −ẑ. Il campo B è orientato come:", "opts": ["+x̂", "−x̂", "−ŷ", "è nullo"], "answer": 1, "exp": "La direzione di propagazione è E×B. Per avere (−z)×B=+y deve essere B=−x."}, {"id": "T18", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "In un conduttore a forma di tronco di cono percorso da corrente stazionaria, indicando con i_A e i_B la corrente totale attraverso due sezioni trasversali A e B:", "opts": ["i_A > i_B", "i_A = i_B", "i_A = 0.5 i_B", "i_A < i_B"], "answer": 1, "exp": "In regime stazionario non si accumula carica: la stessa corrente totale attraversa ogni sezione."}, {"id": "T19", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "La forza elettromotrice (fem) di un generatore di tensione reale si misura:", "opts": ["ai morsetti chiusi", "non può essere misurata", "indifferentemente a morsetti chiusi o aperti", "misurando la d.d.p. ai morsetti esclusivamente a morsetti aperti"], "answer": 3, "exp": "A morsetti aperti I=0, quindi non c'è caduta sulla resistenza interna e V=fem."}, {"id": "T20", "type": "mcq", "cat": "Magnetostatica", "source": "Foto appelli", "q": "La legge di Ampère magnetostatica nel vuoto è espressa da:", "opts": ["∫Γ (∇×B)·dl = μ₀∫S J·dS", "∮Γ B·dl = μ₀∫S(Γ) J·dS", "∫Γ B·dl = μ₀∮S J×dS", "∮Γ B×dl = μ₀∫S J·dS"], "answer": 1, "exp": "La circuitazione di B lungo una linea chiusa è μ₀ volte la corrente concatenata."}, {"id": "T21", "type": "mcq", "cat": "Conduttori e dielettrici", "source": "Foto appelli", "q": "Un condensatore piano è mantenuto a differenza di potenziale costante ΔV da un generatore. Inserendo un dielettrico tra le armature, la carica sulle armature, in modulo:", "opts": ["può aumentare o diminuire", "diminuisce", "resta invariata", "aumenta"], "answer": 3, "exp": "Con V costante, Q=CV. Il dielettrico aumenta C, quindi aumenta Q."}, {"id": "T22", "type": "mcq", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "L'ampiezza dei campi E e B di un'onda sferica, a grande distanza r da una sorgente puntiforme, varia come:", "opts": ["1/r", "1/r²", "1/r^(3/2)", "r"], "answer": 0, "exp": "L'intensità scala come 1/r²; l'ampiezza dei campi, il cui quadrato dà l'intensità, scala come 1/r."}, {"id": "T23", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "L'intensità i della corrente attraverso una superficie S è data, con opportuno significato dei simboli, da:", "opts": ["ΔQ/S", "QΔtS", "dQ/dt", "∫Q²dt"], "answer": 2, "exp": "Per definizione i=dQ/dt."}, {"id": "T24", "type": "mcq", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Il campo E = λ/(2π ε₀ r) r̂ non può rappresentare il campo elettrostatico:", "opts": ["all'interno di un cilindro pieno uniformemente carico", "all'esterno di un cilindro pieno uniformemente carico", "all'esterno di una buccia cilindrica indefinita uniformemente carica", "di un filo rettilineo indefinito uniformemente carico"], "answer": 0, "exp": "Dentro un cilindro pieno uniformemente carico E cresce linearmente con r, non come 1/r."}, {"id": "T25", "type": "mcq", "cat": "Conduttori e dielettrici", "source": "Foto appelli", "q": "In un materiale dielettrico lineare, isotropo e omogeneo con polarizzazione P, la densità di carica di polarizzazione superficiale vale:", "opts": ["n̂·P", "n̂×P", "∇P", "∇·P"], "answer": 0, "exp": "La densità di carica legata superficiale è σ_p=P·n̂."}, {"id": "T26", "type": "mcq", "cat": "Analisi vettoriale", "source": "Foto appelli", "q": "Data una superficie chiusa S che delimita il volume V, il teorema della divergenza afferma che ∮S K·dS è uguale a:", "opts": ["∫V (∇K)×dV", "∫V (∇·K)dV", "∫V (∇K)·dV⃗", "∫V (∇×K)dV"], "answer": 1, "exp": "Teorema di Gauss-Ostrogradsky: flusso = integrale di volume della divergenza."}, {"id": "T27", "type": "mcq", "cat": "Magnetostatica", "source": "Foto appelli", "q": "Una carica puntiforme q in moto in un campo magnetico uniforme può effettuare un moto:", "opts": ["circolare uniforme", "circolare vario", "parabolico", "rettilineo uniformemente accelerato"], "answer": 0, "exp": "Se v è perpendicolare a B, la forza magnetica è centripeta e il moto è circolare uniforme."}, {"id": "T28", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "Nel processo di scarica di un condensatore C attraverso un resistore R, la corrente i(t) evolve:", "opts": ["decrescendo esponenzialmente", "crescendo esponenzialmente", "variando sinusoidalmente", "verso un valore asintotico non nullo"], "answer": 0, "exp": "Il modulo della corrente di scarica è proporzionale a e^(−t/RC)."}, {"id": "T29", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "Nella definizione C=Q/V della capacità di un condensatore:", "opts": ["Q è la somma delle cariche sulle armature e V è la d.d.p.", "Q è la carica su un'armatura e V è il suo potenziale rispetto all'infinito", "Q è la carica su un'armatura e V è la differenza di potenziale tra le armature", "Q è la differenza tra le cariche sulle armature"], "answer": 2, "exp": "Q indica il modulo della carica su una singola armatura; V è la d.d.p. tra le due armature."}, {"id": "T30", "type": "mcq", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Data una configurazione di cariche puntiformi, il potenziale elettrostatico da esse prodotto:", "opts": ["è quello di una singola carica pari alla somma", "si annulla nelle posizioni delle cariche", "è la somma dei potenziali prodotti singolarmente dalle cariche", "è ovunque nullo se la somma algebrica delle cariche è nulla"], "answer": 2, "exp": "Il potenziale è uno scalare e vale il principio di sovrapposizione."}, {"id": "T31", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "Per n resistori R_k collegati in serie, NON è vero che la resistenza equivalente:", "opts": ["eguaglia il reciproco della somma dei reciproci", "è attraversata dalla stessa corrente di ogni R_k", "è la somma delle resistenze", "è maggiore di ogni singolo R_k positivo"], "answer": 0, "exp": "Il reciproco della somma dei reciproci è la formula del parallelo, non della serie."}, {"id": "T32", "type": "mcq", "cat": "Conduttori e dielettrici", "source": "Foto appelli", "q": "Quale proprietà è vera per un conduttore in equilibrio elettrostatico?", "opts": ["sulla superficie e immediatamente all'esterno l'eventuale campo elettrostatico è normale alla superficie", "nel volume del conduttore E è proporzionale alla carica totale", "il conduttore è necessariamente neutro", "all'interno il potenziale varia secondo il gradiente della densità superficiale"], "answer": 0, "exp": "In equilibrio E interno è nullo e la componente tangenziale del campo sulla superficie deve essere nulla."}, {"id": "T33", "type": "mcq", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Per le superfici equipotenziali NON è vero che:", "opts": ["non è necessario compiere lavoro spostando una carica lungo di esse", "tutti i punti hanno lo stesso potenziale", "si intersecano lungo le linee del campo elettrostatico", "sono piani paralleli se il campo elettrostatico è uniforme"], "answer": 2, "exp": "Superfici equipotenziali diverse non si intersecano; le linee di E le attraversano ortogonalmente."}, {"id": "T34", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "In regime stazionario, la II legge di Kirchhoff (legge delle maglie) afferma che:", "opts": ["la somma algebrica delle d.d.p. lungo una maglia è zero", "le d.d.p. sui rami paralleli sono uguali solo senza generatori", "la somma delle d.d.p. è I per la resistenza totale", "la somma algebrica di tutte le d.d.p. è uguale alla somma delle fem"], "answer": 0, "exp": "Con una convenzione coerente dei segni, la somma algebrica delle variazioni di potenziale lungo una maglia chiusa è zero."}, {"id": "T35", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "Nella legge di Ohm ΔV=Ri per un conduttore ohmico, la corrente i:", "opts": ["è sempre opposta in segno a ΔV", "può avere qualsiasi segno concordemente al segno di R", "non è mai negativa", "può essere negativa, ma solo se ΔV<0"], "answer": 3, "exp": "Per R>0, i=ΔV/R ha lo stesso segno di ΔV."}, {"id": "T36", "type": "mcq", "cat": "Elettrostatica", "source": "Foto appelli", "q": "L'energia potenziale elettrostatica di un dipolo p in un campo elettrico E(P) vale:", "opts": ["∇·(pE)", "−p·E(P)", "p×E(P)", "p·(∇×E(P))"], "answer": 1, "exp": "U = −p·E."}, {"id": "T37", "type": "mcq", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Il moto di una particella puntiforme di massa m e carica q sotto l'azione esclusiva di un campo elettrostatico E:", "opts": ["è sempre rettilineo uniformemente accelerato", "ha accelerazione qE/m", "avviene con velocità costante", "è decelerato o accelerato solo in base al segno della carica"], "answer": 1, "exp": "Dalla seconda legge di Newton: ma=qE. Se E varia nello spazio, anche l'accelerazione può variare."}, {"id": "T38", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "Un circuito RLC serie in oscillazioni permanenti, alla risonanza:", "opts": ["l'impedenza è minima e la corrente è massima", "la corrente è nulla", "lo sfasamento corrente-tensione è π/2", "il condensatore è un cortocircuito"], "answer": 0, "exp": "Alla risonanza X_L=X_C e l'impedenza del serie si riduce a R."}, {"id": "T39", "type": "mcq", "cat": "Circuiti", "source": "Foto appelli", "q": "In un circuito RL, all'inizio del transitorio, la corrente nel ramo che contiene l'induttore, in generale:", "opts": ["non subisce brusche variazioni nel tempo", "è sempre costante non nulla", "è sempre nulla", "varia bruscamente nel tempo"], "answer": 0, "exp": "Una variazione istantanea della corrente richiederebbe una tensione infinita L di/dt."}, {"id": "T40", "type": "mcq", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Qual è l'enunciato corretto della legge di riflessione per un raggio luminoso su una superficie piana e liscia?", "opts": ["l'angolo di incidenza è sempre maggiore dell'angolo di riflessione", "i due angoli sono sempre complementari", "l'angolo di incidenza è uguale all'angolo di riflessione", "non c'è riflessione"], "answer": 2, "exp": "Gli angoli, misurati rispetto alla normale, sono uguali."}, {"id": "T41", "type": "mcq", "cat": "Fisica moderna", "source": "Foto appelli", "q": "Perché, secondo la fisica classica, l'atomo non sarebbe stabile?", "opts": ["un elettrone in orbita è una carica accelerata, irradia e perde energia, quindi spiraleggerebbe nel nucleo", "l'attrazione coulombiana è troppo debole", "gli elettroni si respingono impedendo orbite stabili", "gli elettroni non hanno massa"], "answer": 0, "exp": "Nel modello classico una carica accelerata irradia energia; un elettrone orbitante perderebbe energia."}, {"id": "T42", "type": "mcq", "cat": "Elettromagnetismo", "source": "Foto appelli", "q": "In un selettore di velocità con E e B uniformi e opportunamente orientati, le particelle non vengono deviate se:", "opts": ["E=B", "v=E/B", "qE=vBT", "qv=B/E"], "answer": 1, "exp": "Le forze qE e qvB devono avere uguale modulo: E=vB."}, {"id": "T43", "type": "mcq", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Per incidenza normale, il coefficiente di trasmissione dell'ampiezza del campo elettrico dal mezzo 1 (n₁) al mezzo 2 (n₂) vale:", "opts": ["(2n₁/(n₁+n₂))²", "(n₁+n₂)/(2n₁)", "2n₁/(n₁+n₂)", "(n₁−n₂)/(n₁+n₂)"], "answer": 2, "exp": "Per l'ampiezza del campo elettrico: t_E=2n₁/(n₁+n₂)."}, {"id": "T44", "type": "mcq", "cat": "Induzione", "source": "Foto appelli", "q": "Una spira metallica coassiale ed esterna a un solenoide è concatenata con un flusso generato da una corrente i=kt nel solenoide. Trascurando l'autoinduzione, nella spira circola una corrente:", "opts": ["in modulo crescente nel tempo", "costante non nulla", "nulla", "in modulo decrescente"], "answer": 1, "exp": "B e il flusso crescono linearmente nel tempo; dΦ/dt è costante, quindi fem e corrente indotta sono costanti."}, {"id": "N01", "type": "num", "cat": "Magnetostatica", "source": "Appello 07/07/2026", "q": "Un protone si muove con velocità v=520 m/s perpendicolare a un campo B=0.84 T. Con m_p=1.67×10⁻²⁷ kg, determina il raggio di curvatura in m.", "answer": 6.4525e-06, "tol": 0.02, "unit": "m", "exp": "r=mv/(qB), con q=e."}, {"id": "N02", "type": "num", "cat": "Circuiti", "source": "Appello 07/07/2026", "q": "Una corrente i(t)=3.1 cos(5.9 t) A attraversa una sezione. Quanta carica passa nell'intervallo [0,7.7 s]?", "answer": 0.521448, "tol": 0.02, "unit": "C", "exp": "Q=∫i dt=(i₀/ω)sin(ωt₁)."}, {"id": "N03", "type": "num", "cat": "Elettrostatica", "source": "Appello 07/07/2026", "q": "Nel vuoto, una carica q=4.9 pC genera un campo di modulo E=5.3 V/m. Determina la distanza dalla carica in cm.", "answer": 9.1155, "tol": 0.02, "unit": "cm", "exp": "E=kq/r² → r=√(kq/E)."}, {"id": "N04", "type": "num", "cat": "Induzione", "source": "Appello 07/07/2026", "q": "Stima il coefficiente di mutua induzione M tra una piccola spira circolare di raggio 3.7 mm, con centro a distanza R=6.5 cm da un filo rettilineo indefinito complanare, con R≫r. Rispondi in H.", "answer": 1.3233e-10, "tol": 0.04, "unit": "H", "exp": "B≈μ₀I/(2πR) quasi uniforme sulla piccola spira; M=Φ/I≈μ₀r²/(2R)."}, {"id": "N05", "type": "num", "cat": "Onde EM e ottica", "source": "Appello 07/07/2026", "q": "Un raggio passa dal vuoto a un vetro di indice n=3.7 e viene rifratto con angolo 7.8°. Determina l'angolo di incidenza in gradi.", "answer": 30.1, "tol": 0.01, "unit": "°", "exp": "Legge di Snell: sinθᵢ=n sinθᵣ."}, {"id": "N06", "type": "num", "cat": "Circuiti", "source": "Appello 07/07/2026", "q": "Due condensatori C₁=4.7 mF e C₂=9.8 mF sono in serie e sottoposti a ΔV=7.9 V. Determina la d.d.p. ai capi di C₁.", "answer": 5.34, "tol": 0.015, "unit": "V", "exp": "In serie la carica è la stessa; V₁=ΔV·C₂/(C₁+C₂)."}, {"id": "N07", "type": "num", "cat": "Conduttori e dielettrici", "source": "Appello 07/07/2026", "q": "Un condensatore piano di area A=1.6 cm² e distanza d=1.4 mm è riempito trasversalmente per una frazione x con dielettrico εᵣ=1.8. Se C=1.6 pF, determina x.", "answer": 0.72647, "tol": 0.015, "unit": "", "exp": "Le due porzioni sono in parallelo: C=(ε₀A/d)[1+x(εᵣ−1)]."}, {"id": "N08", "type": "num", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un trasmettitore isotropo emette P=4.6 MW in aria. Determina l'intensità a r=10 km, in mW/m².", "answer": 3.66056, "tol": 0.015, "unit": "mW/m²", "exp": "I=P/(4πr²)."}, {"id": "N09", "type": "num", "cat": "Circuiti", "source": "Foto appelli", "q": "Un elettrodomestico assorbe P=0.65 kW a Veff=220 V con fattore di potenza cosφ=0.45. Determina Ieff.", "answer": 6.56566, "tol": 0.015, "unit": "A", "exp": "P=Veff Ieff cosφ."}, {"id": "N10", "type": "num", "cat": "Circuiti", "source": "Foto appelli", "q": "Un generatore reale ha fem f=10.5 V e resistenza interna r=2.25 Ω. Alimenta due resistori uguali R₁=R₂=9.6 Ω in parallelo. Determina la d.d.p. ai capi di R₁.", "answer": 7.14894, "tol": 0.015, "unit": "V", "exp": "R_L=R/2=4.8 Ω; V=f R_L/(r+R_L)."}, {"id": "N11", "type": "num", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un'antenna dipolare ha intensità I₀=4 W/m² sul piano mediano a d₀=36 km. Determina l'intensità a d=91 km nella direzione θ=35° rispetto all'asse del dipolo.", "answer": 0.20595, "tol": 0.02, "unit": "W/m²", "exp": "I=I₀(d₀/d)² sin²θ."}, {"id": "N12", "type": "num", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un'antenna dipolare ha intensità I₀=2 W/m² sul piano mediano a d₀=35 km. Determina l'intensità a d=91 km nella direzione θ=55° rispetto all'asse del dipolo.", "answer": 0.19852, "tol": 0.02, "unit": "W/m²", "exp": "I=I₀(d₀/d)² sin²θ."}, {"id": "N13", "type": "num", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Una carica q=3.8 nC è a distanza da un piano infinito con densità superficiale σ=7.5 mC/m². Determina il modulo della forza tra carica e piano.", "answer": 1.60941, "tol": 0.015, "unit": "N", "exp": "Il campo del piano infinito è E=|σ|/(2ε₀); F=|q|E, indipendente dalla distanza."}, {"id": "N14", "type": "num", "cat": "Magnetostatica", "source": "Foto appelli", "q": "Una carica q=5.7 nC si trova al centro di una spira di raggio R=9.1 cm percorsa da i=1.9 A e si muove radialmente nel piano con v=6.3 m/s. Determina il modulo della forza di Lorentz.", "answer": 4.71094e-13, "tol": 0.02, "unit": "N", "exp": "B=μ₀i/(2R), perpendicolare al piano; F=qvB."}, {"id": "N15", "type": "num", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un'onda piana in un mezzo L.I.O. ha |E|=3.8 V/m e |H|=0.014 A/m. Determina l'impedenza caratteristica del mezzo.", "answer": 271.4286, "tol": 0.01, "unit": "Ω", "exp": "η=|E|/|H|."}, {"id": "N16", "type": "num", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un'onda armonica piana nel vuoto ha frequenza ν=4.5 GHz. Determina il modulo del vettore d'onda k in m⁻¹.", "answer": 94.2478, "tol": 0.01, "unit": "m⁻¹", "exp": "k=2πν/c."}, {"id": "N17", "type": "num", "cat": "Induzione", "source": "Foto appelli", "q": "Un solenoide toroidale sottile ha r=6.8 mm, N=345 e L=14 μH. Determina il raggio mediano R in m.", "answer": 0.247006, "tol": 0.02, "unit": "m", "exp": "Per r≪R, L≈μ₀N²r²/(2R)."}, {"id": "N18", "type": "num", "cat": "Circuiti", "source": "Foto appelli", "q": "Un generatore reale f=4 V, r=0.93 Ω alimenta in serie il parallelo R=33 Ω e L=10 mH. A regime il generatore viene staccato e R-L resta in scarica. Determina la corrente nell'induttore dopo 1 ms.", "answer": 0.1586, "tol": 0.04, "unit": "A", "exp": "A regime L è un corto: I₀=f/r. Dopo il distacco i=I₀e^(−Rt/L)."}, {"id": "N19", "type": "num", "cat": "Onde EM e ottica", "source": "Foto appelli", "q": "Un'onda dal vuoto incide su un dielettrico L.I.O. senza perdite con θᵢ=51°. La direzione rifratta è deflessa di 14° verso la normale, quindi θₜ=37°. Assumendo μᵣ≈1, determina l'impedenza caratteristica del dielettrico.", "answer": 291.74, "tol": 0.025, "unit": "Ω", "exp": "Snell: n=sin51°/sin37°. Per mezzo non magnetico η≈η₀/n."}, {"id": "N20", "type": "num", "cat": "Conduttori e dielettrici", "source": "Appello 07/07/2026", "q": "Un cubo 0≤x,y,z≤a con a=1.9 mm è polarizzato con P=ŷ(αy²+β), α=9.7 C/m⁴. Determina la carica totale di polarizzazione di volume.", "answer": -1.264e-10, "tol": 0.03, "unit": "C", "exp": "ρ_p=−∇·P=−2αy; integrando sul cubo si ottiene Q_vol=−αa⁴."}, {"id": "N21", "type": "num", "cat": "Conduttori e dielettrici", "source": "Foto appelli", "q": "Un cubo 0≤x,y,z≤a con a=3.1 mm è polarizzato con P=ŷ(αy²+β), α=6.7 C/m⁴. Determina la carica totale di polarizzazione sulla superficie.", "answer": 6.18759e-10, "tol": 0.03, "unit": "C", "exp": "La carica legata totale volume+superficie è zero; Q_sup=−Q_vol=αa⁴."}, {"id": "N22", "type": "num", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Un dodecaedro regolare nel vuoto contiene una carica puntiforme al centro. Il flusso del campo elettrico attraverso una faccia è 85 V·m. Determina q in nC.", "answer": 9.03127, "tol": 0.02, "unit": "nC", "exp": "Per simmetria Φ_tot=12·85 V·m; q=ε₀Φ_tot."}, {"id": "N23", "type": "num", "cat": "Elettrostatica", "source": "Foto appelli", "q": "Un dipolo p=p ẑ è all'origine. Nel punto P=(-0.28,0.41,-0.10) m, con p=5.8 μC·mm, determina il potenziale riferito all'infinito.", "answer": -40.1272, "tol": 0.02, "unit": "V", "exp": "V=(1/4πε₀)(p·r)/r³=(1/4πε₀)pz/r³."}, {"id": "N24", "type": "num", "cat": "Circuiti", "source": "Foto appelli", "q": "Un generatore reale di fem 7.3 V alimenta un carico R=22 Ω che assorbe P=2.2 W. Determina la resistenza interna r del generatore.", "answer": 1.08463, "tol": 0.025, "unit": "Ω", "exp": "I=√(P/R); fem=I(R+r) → r=fem/I−R."}, {"id": "N25", "type": "num", "cat": "Induzione", "source": "Foto appelli", "q": "Una spira di superficie S=3.9 cm² ruota in B=1.5 T con periodo T=8.1 s attorno a un diametro perpendicolare a B. Determina l'ampiezza della fem indotta in mV.", "answer": 0.453786, "tol": 0.025, "unit": "mV", "exp": "ε_max=B S ω, con ω=2π/T."}, {"id": "N26", "type": "num", "cat": "Magnetostatica", "source": "Foto appelli", "q": "Una spira quadrata di lato ℓ=8.3 cm, corrente i=5.8 A, è in B=290 G e subisce τ=4.90×10⁻4 N·m. Determina l'angolo positivo tra la normale alla spira e B.", "answer": 25.0163, "tol": 0.02, "unit": "°", "exp": "τ=mB sinθ con m=iℓ²."}, {"id": "T45", "type": "mcq", "cat": "Circuiti", "source": "Foto 13/08/2026", "q": "La legge di Ohm locale lega:", "opts": ["densità di corrente e campo elettrico", "potenziale e capacità", "campo magnetico e flusso elettrico", "carica e massa"], "answer": 0, "exp": "La forma locale della legge di Ohm è J = σE (equivalentemente E = ρJ)."}, {"id": "T46", "type": "mcq", "cat": "Elettrostatica", "source": "Foto 13/08/2026", "q": "Il potenziale elettrostatico è definito come:", "opts": ["la forza esercitata su una carica di prova", "la forza elettromotrice su un percorso chiuso", "il flusso del campo elettrostatico attraverso una superficie", "il lavoro compiuto dal campo elettrico per unità di carica"], "answer": 3, "exp": "La differenza di potenziale è il lavoro del campo elettrico per unità di carica con segno coerente con la convenzione: V_A−V_B = W_{A→B}/q."}, {"id": "T47", "type": "mcq", "cat": "Elettrostatica", "source": "Foto 13/08/2026", "q": "Quale affermazione sulla legge di Gauss per il campo elettrostatico è corretta?", "opts": ["Il campo elettrico è sempre conservativo", "Il flusso del campo elettrico in un volume è proporzionale alla carica totale sulla superficie di delimitazione", "Il flusso del campo elettrico attraverso una superficie chiusa è proporzionale alla carica totale interna alla superficie", "Il flusso del campo elettrico attraverso una superficie chiusa è sempre nullo"], "answer": 2, "exp": "La legge di Gauss stabilisce ∮E·dS = Q_int/ε₀."}, {"id": "T48", "type": "mcq", "cat": "Onde EM e ottica", "source": "Foto 13/08/2026", "q": "In un'onda piana armonica, la lunghezza d'onda λ è:", "opts": ["legata alla periodicità temporale ed è l'intervallo di tempo tra due massimi del campo in un punto", "data dal rapporto |E|/|B|", "pari al modulo del vettore d'onda k", "legata alla periodicità spaziale ed è la distanza tra due ventri (o creste) consecutivi dell'onda"], "answer": 3, "exp": "λ descrive la periodicità spaziale; inoltre k = 2π/λ."}, {"id": "N27", "type": "num", "cat": "Induzione", "source": "Foto let currentSet=[], idx=0, responses={}, checked={}, mode='train';
const $=s=>document.querySelector(s);
const cats=[...new Set(BANK.map(q=>q.cat))].sort(); cats.forEach(c=>$('#category').insertAdjacentHTML('beforeend',`<option>${c}</option>`));
$('#bankInfo').textContent=`Banca dati: ${BANK.length} domande (${BANK.filter(q=>q.type==='mcq').length} a crocette, ${BANK.filter(q=>q.type==='num').length} numeriche).`;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function wrongIds(){try{return JSON.parse(localStorage.getItem('fisica2_wrong')||'[]')}catch{return[]}}
function saveWrong(ids){localStorage.setItem('fisica2_wrong',JSON.stringify([...new Set(ids)]))}
function buildSet(onlyWrong=false){let a=BANK.filter(q=>$('#category').value==='all'||q.cat===$('#category').value); if(onlyWrong){let ids=wrongIds();a=a.filter(q=>ids.includes(q.id))} if($('#order').value==='random')a=shuffle(a); let n=$('#count').value;if(n!=='all')a=a.slice(0,+n);return a}
function begin(set){if(!set.length){alert('Nessuna domanda disponibile con questi filtri.');return}currentSet=set;idx=0;responses={};checked={};mode=$('#mode').value;$('#setup').classList.add('hidden');$('#results').classList.add('hidden');$('#quiz').classList.remove('hidden');render()}
$('#start').onclick=()=>begin(buildSet(false)); $('#wrongOnly').onclick=()=>begin(buildSet(true)); $('#clearWrong').onclick=()=>{localStorage.removeItem('fisica2_wrong');alert('Errori salvati azzerati.')};
function render(){let q=currentSet[idx];$('#progressText').textContent=`Domanda ${idx+1} di ${currentSet.length}`;$('#barFill').style.width=`${(idx/currentSet.length)*100}%`;$('#catBadge').textContent=q.cat;$('#sourceBadge').textContent=q.source;$('#questionText').innerHTML=q.q;$('#feedback').className='feedback hidden';$('#feedback').innerHTML='';$('#next').classList.add('hidden');$('#check').classList.remove('hidden');$('#prev').disabled=idx===0;let area=$('#answerArea');area.innerHTML='';
if(q.type==='mcq'){let box=document.createElement('div');box.className='options';q.opts.forEach((o,i)=>{let lab=document.createElement('label');lab.className='opt';lab.innerHTML=`<input type="radio" name="opt" value="${i}"><span><b>${String.fromCharCode(65+i)}.</b> ${o}</span>`;let inp=lab.querySelector('input');if(responses[q.id]===i)inp.checked=true;inp.onchange=()=>responses[q.id]=i;box.appendChild(lab)});area.appendChild(box)}else{let wrap=document.createElement('div');let inp=document.createElement('input');inp.className='numinput';inp.placeholder='Inserisci il risultato';inp.inputMode='decimal';inp.value=responses[q.id]??'';inp.oninput=()=>responses[q.id]=inp.value;wrap.appendChild(inp);let u=document.createElement('span');u.className='unit';u.textContent=q.unit||'';wrap.appendChild(u);area.appendChild(wrap)}
if(checked[q.id])showFeedback(q);updateLive()}
function numericValue(v){if(v===undefined||v===null||v==='')return NaN;return Number(String(v).trim().replace(',','.').replace(/×10\^?/i,'e'))}
function isCorrect(q){if(q.type==='mcq')return responses[q.id]===q.answer;let v=numericValue(responses[q.id]);if(!Number.isFinite(v))return false;let scale=Math.max(Math.abs(q.answer),1e-15);return Math.abs(v-q.answer)<=q.tol*scale}
function formatAns(q){return q.type==='mcq'?`${String.fromCharCode(65+q.answer)}. ${q.opts[q.answer]}`:`${Number(q.answer).toPrecision(6).replace(/\.0+$/,'')} ${q.unit||''}`}
function showFeedback(q){let ok=isCorrect(q),f=$('#feedback');f.className='feedback '+(ok?'ok':'bad');f.innerHTML=`<b>${ok?'✓ Corretta':'✗ Non corretta'}</b><br>${ok?'':`Risposta corretta: <b>${formatAns(q)}</b><br>`}${q.exp||''}`;f.classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#next').textContent=idx===currentSet.length-1?'Vedi risultato':'Avanti →'}
$('#check').onclick=()=>{let q=currentSet[idx];if(responses[q.id]===undefined||responses[q.id]===''){alert('Inserisci una risposta.');return}checked[q.id]=true;if(mode==='train')showFeedback(q);else{idx===currentSet.length-1?finish():nextStep()}};
$('#next').onclick=()=>idx===currentSet.length-1?finish():nextStep();function nextStep(){idx++;render()} $('#prev').onclick=()=>{if(idx>0){idx--;render()}};
function updateLive(){let answered=Object.keys(checked).length,ok=currentSet.filter(q=>checked[q.id]&&isCorrect(q)).length;$('#liveScore').textContent=mode==='train'?`Corrette ${ok}/${answered}`:'Simulazione'}
function finish(){let ok=currentSet.filter(isCorrect),wrong=currentSet.filter(q=>!isCorrect(q));let old=wrongIds().filter(id=>!ok.some(q=>q.id===id));saveWrong([...old,...wrong.map(q=>q.id)]);$('#quiz').classList.add('hidden');$('#results').classList.remove('hidden');$('#score').textContent=`${ok.length}/${currentSet.length}`;$('#summary').textContent=`${Math.round(ok.length/currentSet.length*100)}% corrette. Errori: ${wrong.length}. Gli errori vengono salvati nel browser per il ripasso.`;let rev=$('#review');rev.innerHTML='';currentSet.forEach((q,i)=>{let d=document.createElement('div');d.className='reviewitem '+(isCorrect(q)?'good':'wrong');d.innerHTML=`<strong>${i+1}. ${q.q}</strong><span>${isCorrect(q)?'✓':'✗'} ${isCorrect(q)?'Corretta':`Corretta: ${formatAns(q)}`}</span>${q.exp?`<div class="small" style="margin-top:5px">${q.exp}</div>`:''}`;rev.appendChild(d)});window.scrollTo({top:0,behavior:'smooth'})}
$('#restart').onclick=()=>{location.reload()};$('#retryWrong').onclick=()=>{let w=currentSet.filter(q=>!isCorrect(q)); if(!w.length){alert('Nessun errore da rifare.');return}begin(shuffle(w))};
const SITE_PASSWORD = "BEATRICESNOB52";

function login() {
  const entered = document.getElementById("passwordInput").value;

  if (entered === SITE_PASSWORD) {
    document.getElementById("loginScreen").style.display = "none";
    sessionStorage.setItem("fisica2_logged", "yes");
  } else {
    document.getElementById("loginError").style.display = "block";
  }
}

document.getElementById("loginButton").addEventListener("click", login);

document.getElementById("passwordInput").addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    login();
  }
});

if (sessionStorage.getItem("fisica2_logged") === "yes") {
  document.getElementById("loginScreen").style.display = "none";
}

</script>
